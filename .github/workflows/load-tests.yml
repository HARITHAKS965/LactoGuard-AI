name: Load E2E Automated Tests & Excel Report Generation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-tests:
    name: Load Performance Audit & Excel Report Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Run load-tests (100 Load E2E Tests)
        working-directory: load-tests
        run: |
          npm ci || npm install
          npm test || true

      - name: Upload Load Test Excel Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: |
            load-tests/reports/*.xlsx
