name: Selenium E2E Automated Tests & Excel Report Generation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Start Web Application Server
        run: |
          npx -y http-server web -p 8081 &
          sleep 3

      - name: Install & Run selenium-tests (300 E2E Tests)
        working-directory: selenium-tests
        run: |
          npm install
          npm test || true

      - name: Install & Run collabroom-tests/selenium
        if: always()
        working-directory: collabroom-tests/selenium
        run: |
          npm install
          npm test || true

      - name: Upload Excel Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            selenium-tests/reports/*.xlsx
            collabroom-tests/reports/*.xlsx
