publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.6.1
  easy_localization: ^3.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^3.15.2
  cupertino_icons: ^1.0.8
  http: ^1.2.2
