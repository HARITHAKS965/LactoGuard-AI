  cloud_firestore: ^5.6.12
  firebase_database: ^11.3.10
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
